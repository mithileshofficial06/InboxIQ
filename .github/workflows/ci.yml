name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # npm workspaces: the lockfile lives at the repo root, so install there
      # and target the backend workspace for the individual scripts.
      - run: npm ci

      - name: Typecheck
        run: npm run build --workspace backend

      - name: Test
        run: npm test --workspace backend

  ai-service:
    name: AI service (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace frontend

      # Also typechecks — `next build` runs tsc over the app.
      - name: Build
        run: npm run build --workspace frontend
